name: analisis-estatico

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Versiones fijas: las mismas con las que se probó la demo (noviembre de 2026).
      - name: Instalar herramientas
        run: pip install ruff==0.16.9 semgrep==1.184.0

      - name: Linter, seguridad básica y complejidad (Ruff)
        run: ruff check --output-format=github .

      # Corre aunque Ruff haya fallado, para mostrar todos los hallazgos juntos.
      - name: Taint y guardrails de arquitectura (Semgrep, reglas propias)
        if: success() || failure()
        run: semgrep scan --config reglas/ --error --metrics=off
