[project]
name = "tienda-demo-analisis-estatico"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["flask>=3.0"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["_solucion"]

[tool.ruff.lint]
# E/F: errores y estilo básicos · B: bugs probables · S: seguridad (reglas de Bandit) · C90: complejidad
select = ["E", "F", "B", "S", "C90"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # en los tests, assert está permitido

[tool.ruff.lint.mccabe]
max-complexity = 6
